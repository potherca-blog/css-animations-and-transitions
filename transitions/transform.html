<header>
  <h1><title>transition-property: transform;</title></h1>
  <style>
    .container .subject {
      transform: rotate(0deg);
    }

    .container:hover .subject {
      transform: rotate(360deg);
    }
  </style>
</header>

<section class="container">
  <div class="subject"></div>
</section>
